workspace:
  base: /workdir
  path: muxnix/
when:
  - event: push
  - event: manual
steps:
  - name: build-yocto
    image: muxelplexer/build-images
    pull: true
    volumes:
      - /opt/woodpecker/sstate-cache:/workdir/build/sstate-cache/
      - /opt/woodpecker/downloads:/workdir/build/downloads/
    commands:
      - ./scripts/ci_build.sh
